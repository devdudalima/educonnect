<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

       <style>
        .geral {
          background-color: #4f46e5;
          font-family: Arial, sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          margin: 0;
        }

        .teladelogin {
            background-color: white;
            text-align: center;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0px 5px 30px rgba(0, 0, 0, 0.25);
        }

        .logo {
            margin-bottom: 25px;
            max-width: 60%;
            
        }
        .nome {
            margin-bottom: 25px;


        }

        .form-control {
            margin-bottom: 15px;
        }

        .botao {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
        }

        .botao:hover {
            background-color: #3730a3;
        }

    </style>
</head>
<body>
  
    <!-- Tela de Login -->
    <div class="geral">
    <div class="teladelogin">
      <img class="logo" src="c:\Users\a92309303\Documents\logoeduconectof.png" alt="logo Educonnect">
      <h1  class="nome">Educonnect</h1>
      <form class="form">
        <label for="matricula"> Matricula:</label><br>
        <input type="text" class="form-control" id="matricula" name="matricula" placeholder="Digite sua matricula"> 
        <label for="senha"> Senha: </label>
        <input type="text" class="form-control" id="senha" name="senha" placeholder="Digite sua senha">
        <button type="submit" class="botao">Entrar</button>

       </form>
    </div>
    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>

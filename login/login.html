<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/ca7100e5dd.js" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- Tela de Login -->


  <div class="geral">
    <div class="teladelogin">

      <img class="logo" src="../logoeduconectof.png" alt="logo Educonnect">

      <h1 class="nome">EduConnect</h1>

      <p class="subtitulo">Sua jornada acadêmica começa aqui</p>

      <form class="form">

        <div class="input-container">

          <label class="label-input" for="Email"> Email:</label>

          <div class="caixa-input">

            <i class="fa-solid fa-user-graduate"></i>

            <input type="text" class="form-control" id="email" name="email" placeholder="Digite seu email">

          </div>

        </div>


        <div class="input-container">

          <label class="label-input" for="senha"> Senha: </label>

          <div class="caixa-input">

            <i class="fa-solid fa-key"></i>

            <input type="text" class="form-control" id="senha" name="senha" placeholder="Digite sua senha">

          </div>

        </div>

        <div class="btn-entrar">
          <p>Entrar</p>
          <i class="fa-solid fa-right-to-bracket"></i>
        </div>

      </form>

    </div>
  </div>


  <script src="login.js"></script>
</body>

</html>

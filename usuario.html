<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect- Perfil do aluno</title>
    <!-- Bootstrap e Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="usuario.css">
</head>
<body>


<aside class="col-lg-4">
  <div class="painel-perfil sticky-lg-top text-white text-center rounded-5 px-4 py-5" style="top:1.5rem">

    <!-- Foto de perfil -->
    <div class="position-relative d-inline-block mb-3">
      <div class="foto-container rounded-circle">
        <span id="iniciaisPerfil">RO</span>
        <img src="adicione sua foto" id="fotoPerfil" alt="Foto de perfil" class="rounded-circle" style="display: none;">
    </div>

      <!-- Indicador online -->
      <span class="position-absolute bottom-0 end-0 p-2 bg-success border border-3 border-white rounded-circle">
        <span class="visually-hidden">Online</span>
      </span>

    </div>
    <!-- Botão alterar foto -->
    <div class="mb-3">
      <label for="uploadFoto" class="btn btn-light btn-sm rounded-pill px-3">Alterar foto</label>
      <input type="file" id="uploadFoto" accept="image/*" class="d-none">
    </div>

    <!-- Informações do aluno -->
    <h1 class="h3 fw-bold mb-1">Ricardo Oliveira</h1>
    <p class="text-white-50 mb-3">3º Ano Ensino Médio</p>
    <span class="badge rounded-pill bg-white bg-opacity-25 fw-medium px-3 py-2">RA: 2024.0892-X</span>
  </div>
</aside>

</html>

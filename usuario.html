<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect - Perfil do aluno</title>

    <!-- Fonte, Bootstrap e Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Nossos estilos: base (compartilhado) vem primeiro, depois o da tela -->
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="usuario.css">
</head>
<body>

<div class="container pagina">
  <div class="row g-4">

    <!-- ===== COLUNA ESQUERDA: PERFIL ===== -->
    <aside class="col-lg-4">
      <div class="painel-perfil">

        <!-- Foto de perfil + bolinha "online" -->
        <div class="foto-wrapper">
          <div class="foto-aluno">
            <span id="iniciaisPerfil">RO</span>
            <!-- Para usar a foto real: coloque o caminho em src e troque display:none por display:block -->
            <img id="fotoPerfil" alt="Foto de perfil" style="display:none;">
          </div>
          <span class="indicador-online"><span class="visually-hidden">Online</span></span>
        </div>

        <!-- Informações do aluno -->
        <h1 class="perfil-nome">Ricardo Oliveira</h1>
        <p class="perfil-serie">3º Ano Ensino Médio</p>
        <span class="perfil-ra">RA: 2024.0892-X</span>
      </div>
    </aside>

    <!-- ===== COLUNA DIREITA: CONTEÚDO ===== -->
    <main class="col-lg-8 pilha">

      <!-- Nível e conquistas -->
      <section class="cartao">
        <div class="nivel-topo">
          <div class="nivel-id">
            <div class="tam-52 cor-amarelo"><i class="bi bi-trophy"></i></div>
            <div>
              <div class="rotulo-pequeno maiusculas">Nível atual</div>
              <div class="nivel-nome">Mestre Aprendiz</div>
              <div class="rotulo-pequeno">Nível 14</div>
            </div>
          </div>
          <div class="pontos">
            <div class="rotulo-pequeno maiusculas">Total de pontos</div>
            <div class="pontos-valor">12.450 XP</div>
          </div>
        </div>

        <!-- Barra de progresso -->
        <div class="progresso-info">
          <span>Progresso para Nível 15</span>
          <span>85%</span>
        </div>
        <div class="progress" role="progressbar" aria-label="Progresso para o Nível 15" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar" style="width:85%"></div>
        </div>

        <!-- Conquistas recentes -->
        <h2 class="conquistas-titulo">Conquistas Recentes</h2>
        <div class="conquistas">
          <button type="button" class="tam-64 cor-primaria" title="Resposta rápida"><i class="bi bi-lightning-charge-fill"></i></button>
          <button type="button" class="tam-64 cor-amarelo" title="Destaque da turma"><i class="bi bi-star-fill"></i></button>
          <button type="button" class="tam-64 cor-verde" title="Presença perfeita"><i class="bi bi-calendar-check-fill"></i></button>
          <button type="button" class="tam-64 cor-vermelho" title="Mestre do laboratório"><i class="bi bi-eyedropper"></i></button>
          <button type="button" class="tam-64 conquista-nova" title="Ver todas as conquistas"><i class="bi bi-plus-lg"></i></button>
        </div>
      </section>

      <!-- Indicadores: Frequência e Média Geral -->
      <div class="indicadores">
        <div class="cartao cartao-indicador">
          <div class="tam-60 cor-primaria"><i class="bi bi-graph-up-arrow"></i></div>
          <div>
            <div class="rotulo-pequeno">Frequência</div>
            <div class="indicador-valor">94,5%</div>
          </div>
        </div>
        <div class="cartao cartao-indicador">
          <div class="tam-60 cor-roxo"><i class="bi bi-mortarboard-fill"></i></div>
          <div>
            <div class="rotulo-pequeno">Média Geral</div>
            <div class="indicador-valor">8,9</div>
          </div>
        </div>
      </div>

      <!-- Menu da conta -->
      <nav class="cartao cartao-menu" aria-label="Minha conta">
        <div class="list-group menu-conta">

          <a href="dados_pessoais.html" class="list-group-item list-group-item-action item-menu">
            <span class="tam-40 cor-neutra"><i class="bi bi-person-fill"></i></span>
            <span class="item-menu-texto">Dados Pessoais</span>
            <i class="bi bi-chevron-right"></i>
          </a>

          <button type="button" class="list-group-item list-group-item-action item-menu">
            <span class="tam-40 cor-neutra"><i class="bi bi-bell-fill"></i></span>
            <span class="item-menu-texto">Configurações de Notificação</span>
            <i class="bi bi-chevron-right"></i>
          </button>

          <button type="button" class="list-group-item list-group-item-action item-menu">
            <span class="tam-40 cor-neutra"><i class="bi bi-shield-lock-fill"></i></span>
            <span class="item-menu-texto">Segurança e Senha</span>
            <i class="bi bi-chevron-right"></i>
          </button>

          <button type="button" class="list-group-item list-group-item-action item-menu">
            <span class="tam-40 cor-neutra"><i class="bi bi-file-earmark-text-fill"></i></span>
            <span class="item-menu-texto">Documentos Escolares</span>
            <i class="bi bi-chevron-right"></i>
          </button>

          <button type="button" class="list-group-item list-group-item-action item-menu item-sair">
            <span class="tam-40 cor-vermelho"><i class="bi bi-box-arrow-right"></i></span>
            <span>Sair da Conta</span>
          </button>
        </div>
      </nav>

      <!-- Rodapé -->
      <footer class="rodape">EduConnect v2.4.1</footer>
    </main>
  </div>
</div>

</body>
</html>
